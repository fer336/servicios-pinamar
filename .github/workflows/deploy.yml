name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME_WEB: ghcr.io/fer336/servicios-pinamar-web
  IMAGE_NAME_API: ghcr.io/fer336/servicios-pinamar-api
  IMAGE_NAME_CMS: ghcr.io/fer336/servicios-pinamar-cms

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z, for example v1.0.0" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME_WEB }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME_WEB }}:latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME_API }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME_API }}:latest

      - name: Build and push CMS image
        uses: docker/build-push-action@v6
        with:
          context: apps/cms
          file: apps/cms/Dockerfile
          push: true
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.IMAGE_NAME_CMS }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME_CMS }}:latest

      - name: Pin compose image
        run: |
          perl -0pi -e 's#image: ghcr\.io/fer336/servicios-pinamar-web:[^\n]+#image: ghcr.io/fer336/servicios-pinamar-web:${{ steps.version.outputs.version }}#; s#image: ghcr\.io/fer336/servicios-pinamar-api:[^\n]+#image: ghcr.io/fer336/servicios-pinamar-api:${{ steps.version.outputs.version }}#; s#image: ghcr\.io/fer336/servicios-pinamar-cms:[^\n]+#image: ghcr.io/fer336/servicios-pinamar-cms:${{ steps.version.outputs.version }}#' docker-compose.yml

      - name: Commit compose image pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "chore(deploy): pin image to ${{ steps.version.outputs.version }}" || exit 0
          git push origin HEAD:main

      - name: Trigger Portainer webhook
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK secret is required" >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$PORTAINER_WEBHOOK"
