<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Planos técnicos para instalaciones de una vivienda costera</title>
  <desc id="desc">Ilustración de un documento técnico con grilla, casa costera, reglas y trazados de gas, agua y sanitario en tonos verdes y crema.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="0.54" stop-color="#f5f2eb"/>
      <stop offset="1" stop-color="#dfe9e4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#285f51"/>
      <stop offset="1" stop-color="#173f38"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#285f51" stroke-opacity="0.12" stroke-width="2"/>
      <path d="M12 0v48M24 0v48M36 0v48M0 12h48M0 24h48M0 36h48" fill="none" stroke="#285f51" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#152f29" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#eef2ef"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="1000" cy="150" r="210" fill="#b8de8a" opacity="0.18"/>
  <circle cx="155" cy="770" r="250" fill="#ffe897" opacity="0.16"/>

  <g filter="url(#softShadow)">
    <rect x="185" y="95" width="830" height="690" rx="42" fill="url(#paper)"/>
    <rect x="226" y="136" width="748" height="608" rx="28" fill="url(#grid)" stroke="#173f38" stroke-opacity="0.16" stroke-width="3"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M366 458V330l236-152 232 152v128" stroke="#173f38" stroke-width="16"/>
    <path d="M432 458V346h120v112M622 458V334h138v124" stroke="#285f51" stroke-width="11"/>
    <path d="M340 506h520M390 560h165M635 560h185" stroke="#173f38" stroke-opacity="0.35" stroke-width="7"/>
    <path d="M383 632c102-82 180-82 278 0 66 55 126 58 192 8" stroke="#7f9684" stroke-width="10"/>
    <path d="M390 624c88-58 166-56 257 17 62 49 119 50 190 4" stroke="#285f51" stroke-width="5" stroke-dasharray="17 18"/>
    <path d="M398 392h86M678 392h92M542 458v-77M552 381h-20" stroke="#173f38" stroke-opacity="0.5" stroke-width="5"/>
  </g>

  <g fill="url(#green)">
    <rect x="258" y="188" width="98" height="18" rx="9"/>
    <rect x="258" y="220" width="142" height="10" rx="5" opacity="0.72"/>
    <rect x="258" y="244" width="92" height="10" rx="5" opacity="0.48"/>
  </g>

  <g transform="translate(830 574) rotate(-11)">
    <rect x="0" y="0" width="190" height="54" rx="16" fill="#fffdfa" stroke="#173f38" stroke-opacity="0.26" stroke-width="3"/>
    <path d="M26 12v18M50 12v10M74 12v18M98 12v10M122 12v18M146 12v10M170 12v18" stroke="#173f38" stroke-opacity="0.58" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(255 614)">
    <circle cx="0" cy="0" r="52" fill="#173f38" opacity="0.95"/>
    <path d="M-20 0h40M0-20v40" stroke="#fffdfa" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g fill="#173f38" opacity="0.72">
    <circle cx="878" cy="214" r="8"/>
    <circle cx="914" cy="214" r="8"/>
    <circle cx="950" cy="214" r="8"/>
  </g>
</svg>
