server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location = /pintura {
        return 301 /servicios/pintura/;
    }
    location = /pintura/ {
        return 301 /servicios/pintura/;
    }
    location = /hidrolavado {
        return 301 /servicios/hidrolavado/;
    }
    location = /hidrolavado/ {
        return 301 /servicios/hidrolavado/;
    }
    location = /plomeria {
        return 301 /servicios/plomeria/;
    }
    location = /plomeria/ {
        return 301 /servicios/plomeria/;
    }
    location = /gas {
        return 301 /servicios/gas/;
    }
    location = /gas/ {
        return 301 /servicios/gas/;
    }

    location /pintura-pinamar/ {
        return 301 /servicios/pintura/;
    }
    location /hidrolavado-pinamar/ {
        return 301 /servicios/hidrolavado/;
    }
    location /plomeria-pinamar/ {
        return 301 /servicios/plomeria/;
    }
    location /gasista-pinamar/ {
        return 301 /servicios/gas/;
    }

    location /_astro/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|mjs|json|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ~* \.(?:html|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }
}
